server:
  port: 18080

spring:
  application:
    name: tracker

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    # DB_URL은 환경마다 완전한 JDBC 접속 문자열을 그대로 넘김.
    # - 로컬/컨테이너 Oracle DB: jdbc:oracle:thin:@oracle-db:1521/XEPDB1
    # - Oracle Autonomous Database(Always Free, TLS, 지갑 없이 접속): 콘솔의
    #   TLS 접속 문자열을 그대로 사용 (jdbc:oracle:thin:@(description=...))
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.tracker.tracker
  configuration:
    map-underscore-to-camel-case: true
